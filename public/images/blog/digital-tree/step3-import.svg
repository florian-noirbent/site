<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"><title>Step 3: rebuild the vertex buffer in Unity</title><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ah-blender" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e87d0d"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#ffffff" stroke="#e3e7ec" stroke-width="2"/><text x="28" y="40" font-size="20" font-weight="700" fill="#1f2933" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Step 3: rebuild the vertex buffer in Unity</text><rect x="40" y="80" width="432.0" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="256.0" y="104" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">POSITION</text><text x="256.0" y="124" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">float32 × 3  (12 B)</text><rect x="472.0" y="80" width="144.0" height="56" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/><text x="544.0" y="104" font-size="13" font-weight="700" fill="#c026d3" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">TEXCOORD0</text><text x="544.0" y="124" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Depth  int32  (4 B)</text><rect x="616.0" y="80" width="144.0" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="688.0" y="104" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">TEXCOORD1</text><text x="688.0" y="124" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Radius  float32  (4 B)</text><text x="40.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0</text><text x="184.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text><text x="328.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">8</text><text x="472.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">12</text><text x="616.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">16</text><text x="760.0" y="154" font-size="10.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">20</text><text x="400" y="174" font-size="12.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">one vertex = 20 bytes, laid out from the header (VertexAttributeDescriptor)</text><rect x="28" y="220" width="168" height="100" rx="10" fill="#eef2f6" stroke="#334155" stroke-width="1.5"/><text x="112.0" y="250" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">FmtImporter.cs</text><text x="112.0" y="278" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ScriptedImporter for .fmt</text><text x="112.0" y="296" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">parses header + data</text><line x1="197" y1="270" x2="211" y2="270" stroke="#5f6b7a" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="212" y="220" width="168" height="100" rx="10" fill="#eef2f6" stroke="#334155" stroke-width="1.5"/><text x="296.0" y="250" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SetVertexBufferParams</text><text x="296.0" y="278" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">layout from the header:</text><text x="296.0" y="296" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Position, TexCoord0, TexCoord1</text><line x1="381" y1="270" x2="395" y2="270" stroke="#5f6b7a" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="396" y="220" width="168" height="100" rx="10" fill="#eef2f6" stroke="#334155" stroke-width="1.5"/><text x="480.0" y="250" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SetVertexBufferData</text><text x="480.0" y="278" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">JSON values → raw bytes</text><text x="480.0" y="296" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(16 or 20-byte structs)</text><line x1="565" y1="270" x2="579" y2="270" stroke="#5f6b7a" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="580" y="220" width="168" height="100" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/><text x="664.0" y="250" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Mesh asset</text><text x="664.0" y="278" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">32-bit indices,</text><text x="664.0" y="296" font-size="11.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MeshTopology.Lines</text><text x="400" y="360" font-size="12.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">In the shader, TEXCOORD0 is the depth: depth and time move the glow from trunk to tips,</text><text x="400" y="380" font-size="12.5" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">and TEXCOORD1 is the branch radius, available to scale the effect.</text></svg>
