="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">number = Depth,  halo size = Radius</text><text x="370" y="92" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Compute depth (ComputeDepth.py)</text><text x="370" y="120" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">• ring 1: vertices flagged as skin root</text><text x="370" y="142" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">• ring 2: unvisited neighbors of ring 1</text><text x="370" y="164" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">• ring 3, 4, …: repeat until every vertex is reached</text><text x="370" y="186" font-size="13" font-weight="400" fill="#0e7490" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">→ result written with foreach_set into Depth (int)</text><text x="370" y="230" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Skin radius to attribute (SkinRadiusToAttribute.py)</text><text x="370" y="256" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">• copies each skin vertex's X radius into Radius (float)</text><rect x="370" y="290" width="400" height="120" rx="8" fill="#f5f7fa" stroke="#e3e7ec" stroke-width="1.5"/><text x="390" y="314" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">vertex</text><text x="520" y="314" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Depth (INT)</text><text x="650" y="314" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Radius (FLOAT)</text><text x="390" y="342" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0  (trunk base)</text><text x="520" y="342" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">1</text><text x="650" y="342" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0.30</text><text x="390" y="366" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">2</text><text x="520" y="366" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">3</text><text x="650" y="366" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0.22</text><text x="390" y="390" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">7  (branch tip)</text><text x="520" y="390" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">5</text><text x="650" y="390" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0.10</text><text x="570" y="430" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Example values, as filled by the two operators</text></svg>
